name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise run lint
      - run: mise run test
      - run: mise run build
      - name: Validate the built packages
        run: |
          brew install mikker/tap/fut
          for manifest in extensions/*/fut-extension.toml; do
            fut extension validate "$(dirname "$manifest")"
          done
